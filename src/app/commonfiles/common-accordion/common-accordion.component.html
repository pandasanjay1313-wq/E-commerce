
<div class="accordion">

    <div class="accordion-header" (click)="toggleAccordion()">

        <span class="accordion-title">{{title}}</span>

        <span class="accordion-icon">{{ isOpen ? '▲' : '▼' }}</span>
    </div>
    
    <div class="accordion-content" *ngIf="isOpen">
        {{content}}
    </div>
</div> <br><br>
