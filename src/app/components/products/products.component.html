
<div class="container mt-4">
  <h2 class="mb-4">Our Products</h2>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="row" *ngIf="!loading">
    <div class="col-md-4 col-sm-6 mb-4" *ngFor="let product of products">
      <div class="card h-100 product-card">
        <!-- Clickable image -->
        <div class="image-container" (click)="viewDetails(product.id)">
          <img [src]="product.thumbnail"
               [alt]="product.title"
               class="card-img-top clickable-image"
               style="height: 200px; object-fit: cover; cursor: pointer;">
          <div class="image-overlay">
            <i class="fas fa-eye"></i>
            <span>View Details</span>
          </div>
        </div>

        <div class="card-body d-flex flex-column">
          <!-- Clickable title -->
          <h5 class="card-title clickable-title" (click)="viewDetails(product.id)">
            {{ product.title }}
          </h5>

          <p class="card-text text-muted small">{{ product.brand }}</p>
          <p class="card-text flex-fill">{{ product.description | slice:0:100 }}...</p>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="h5 text-success mb-0">${{ product.price }}</span>
            <span class="text-warning">
              <i class="fas fa-star"></i> {{ product.rating }}
            </span>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="text-muted">Stock: {{ product.stock }}</small>
            <small class="text-muted">{{ product.category }}</small>
          </div>

          <div class="btn-group w-100">
            <button class="btn btn-outline-primary" (click)="viewDetails(product.id)">
              <i class="fas fa-info-circle"></i> Details
            </button>
            <button class="btn btn-primary"
                    (click)="addToCart(product)"
                    [disabled]="product.stock === 0">
              <i class="fas fa-cart-plus"></i> Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
